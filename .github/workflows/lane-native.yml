name: Lane exact native graph
on:
  workflow_dispatch:
  push:
    paths:
      - 'workspace/src/aiformula/control/lane_mapping_lya_reference/**'
      - '.github/workflows/lane-native.yml'
  pull_request:
    paths:
      - 'workspace/src/aiformula/control/lane_mapping_lya_reference/**'
      - '.github/workflows/lane-native.yml'
permissions:
  contents: read
jobs:
  native:
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, ubuntu-latest]
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        shell: bash
    env:
      LANE_REQUIRE_NATIVE: '1'
    steps:
      - name: Verify canonical repository
        run: |
          test "$GITHUB_REPOSITORY_ID" = "1303517209"
          test "$GITHUB_REPOSITORY" = "Sophia-AI-formula-team/neo_aiformula_sophia"
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: Build and test exact native graph
        working-directory: workspace/src/aiformula/control/lane_mapping_lya_reference
        run: |
          python -m pip install setuptools pytest numpy
          python setup.py build_ext --inplace
          mkdir native-evidence
          PYTHONPATH=. python scripts/verify_native.py --source native/lane_graph_native.c --output native-evidence/native.json
          python -m pytest test/test_native_graph_integration.py test/test_native_graph_kernel.py test/test_native_radius_graph.py test/test_native_local_support.py test/test_native_nearest.py test/test_native_cross_section.py test/test_native_local_moments.py test/test_native_local_geometry.py test/test_native_finite_projection.py test/test_native_current_union.py test/test_native_current_union_dispatch.py -q --junitxml=native-evidence/tests.xml
          cp _lane_mapping_lya_native*.pyd native-evidence/ 2>/dev/null || cp _lane_mapping_lya_native*.so native-evidence/
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: lane-native-${{ matrix.os }}-py313
          path: workspace/src/aiformula/control/lane_mapping_lya_reference/native-evidence
          retention-days: 14
