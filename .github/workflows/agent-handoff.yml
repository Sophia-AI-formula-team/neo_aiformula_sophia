name: Agent handoff integrity
on:
  workflow_dispatch:
  push:
    paths:
      - 'AGENTS.md'
      - 'AGENT_CONTEXT.md'
      - 'README.md'
      - '.gitattributes'
      - 'docs/agent-context/**'
      - 'docs/experiments/2026-11-20-mapassist/concept/**'
      - 'docs/experiments/2026-11-21-concept/**'
      - 'tools/agent_handoff.py'
      - 'tools/tests/**'
      - '.github/workflows/agent-handoff.yml'
  pull_request:
    paths:
      - 'AGENTS.md'
      - 'AGENT_CONTEXT.md'
      - 'README.md'
      - '.gitattributes'
      - 'docs/agent-context/**'
      - 'docs/experiments/2026-11-20-mapassist/concept/**'
      - 'docs/experiments/2026-11-21-concept/**'
      - 'tools/agent_handoff.py'
      - 'tools/tests/**'
      - '.github/workflows/agent-handoff.yml'
permissions:
  contents: read
jobs:
  context-and-offline-tools:
    runs-on: ${{ matrix.os }}
    timeout-minutes: 8
    strategy:
      fail-fast: false
      matrix:
        # The Ubuntu 24.04 runner still supplies the Foxy-era Python 3.8.
        os: [ubuntu-24.04, windows-latest]
        python: ['3.8', '3.13']
    steps:
      - name: Verify canonical repository identity
        run: python -c "import os; assert os.environ['GITHUB_REPOSITORY_ID'] == '1303517209'; assert os.environ['GITHUB_REPOSITORY'] == 'Sophia-AI-formula-team/neo_aiformula_sophia'"
      - name: Enable long archive paths in Git on Windows
        if: runner.os == 'Windows'
        run: git config --global core.longpaths true
      - uses: actions/checkout@v4
        with:
          sparse-checkout: |
            .github/workflows
            codexws
            docs/agent-context
            docs/experiments/2026-11-19-yolop-selection
            docs/experiments/2026-11-20-mapassist
            docs/experiments/2026-11-21-concept
            tools
            workspace/src/aiformula/control/lane_mapping_lya_reference
            workspace/src/aiformula/control/lane_mapping_fixed
            workspace/src/aiformula/control/lane_mapping_fixed_gnss
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - name: Test packager, sealed records, local links and exact bundle bytes
        run: python -B -m unittest discover -s tools/tests -v
      - name: Test Concept shortcut installation and rollback
        if: runner.os == 'Linux'
        run: |
          python -B docs/experiments/2026-11-20-mapassist/concept/test_concept_shortcuts.py
          python -B docs/experiments/2026-11-21-concept/test_upgrade.py
          python -B docs/experiments/2026-11-21-concept/test_legacy_install.py
