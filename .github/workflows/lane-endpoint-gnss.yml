name: Endpoint GNSS (ROS 2 Foxy)
on:
  workflow_dispatch:
  push:
    paths:
      - 'workspace/src/aiformula/control/lane_mapping_lya_reference/**'
      - 'workspace/src/aiformula/control/lane_mapping_fixed/**'
      - 'workspace/src/aiformula/control/lane_mapping_fixed_gnss/**'
      - 'workspace/src/aiformula/control/trajectory_follower/**'
      - 'workspace/src/aiformula/perception/road_detector/**'
      - 'workspace/src/aiformula/launchers/**'
      - 'dependencies/vectornav/vectornav_msgs/**'
      - '.github/workflows/lane-endpoint-gnss.yml'
  pull_request:
    paths:
      - 'workspace/src/aiformula/control/lane_mapping_lya_reference/**'
      - 'workspace/src/aiformula/control/lane_mapping_fixed/**'
      - 'workspace/src/aiformula/control/lane_mapping_fixed_gnss/**'
      - 'workspace/src/aiformula/control/trajectory_follower/**'
      - 'workspace/src/aiformula/perception/road_detector/**'
      - 'workspace/src/aiformula/launchers/**'
      - 'dependencies/vectornav/vectornav_msgs/**'
      - '.github/workflows/lane-endpoint-gnss.yml'
permissions:
  contents: read
jobs:
  foxy-build-and-dds:
    runs-on: ubuntu-latest
    container: ros:foxy-ros-base-focal
    timeout-minutes: 20
    steps:
      - name: Verify canonical deployment repository
        shell: bash
        run: |
          test "$GITHUB_REPOSITORY_ID" = "1303517209"
          test "$GITHUB_REPOSITORY" = "Sophia-AI-formula-team/neo_aiformula_sophia"
      - uses: actions/checkout@v4
        with:
          sparse-checkout: |
            workspace/src/aiformula/control/lane_mapping_lya_reference
            workspace/src/aiformula/control/lane_mapping_fixed
            workspace/src/aiformula/control/lane_mapping_fixed_gnss
            workspace/src/aiformula/control/trajectory_follower
            workspace/src/aiformula/perception/road_detector/road_detector
            workspace/src/aiformula/perception/road_detector/test
            workspace/src/aiformula/launchers
            dependencies/vectornav/vectornav_msgs
      - name: Install dependencies in disposable CI container
        shell: bash
        run: |
          set -euo pipefail
          curl -fsSL https://raw.githubusercontent.com/ros/rosdistro/master/ros.key | gpg --dearmor --yes -o /usr/share/keyrings/ros-archive-keyring.gpg
          apt-get update
          apt-get install -y --no-install-recommends python3-pip python3-colcon-common-extensions python3-numpy python3-pytest python3-matplotlib python3-opencv ros-foxy-tf2-ros ros-foxy-tf2-geometry-msgs ros-foxy-tf-transformations ros-foxy-cv-bridge ros-foxy-can-msgs
          # Official rosdep uses pip for this tf_transformations dependency on Focal.
          python3 -m pip install --no-deps transforms3d==0.4.2
      - name: Build all three packages, regression and real DDS isolation checks
        shell: bash
        run: bash workspace/src/aiformula/control/lane_mapping_fixed_gnss/scripts/ci_verify.sh "$GITHUB_WORKSPACE"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: lane-endpoint-gnss-foxy-validation
          path: |
            /tmp/lane_endpoint_gnss_ws/log
            /tmp/lane_endpoint_gnss_ws/build/*/test_results
            /tmp/lane_endpoint_gnss_ws/evidence
          retention-days: 14
