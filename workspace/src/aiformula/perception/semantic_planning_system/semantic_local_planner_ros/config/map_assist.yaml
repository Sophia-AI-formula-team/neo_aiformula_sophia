map_assist:
  ros__parameters:
    odom_topic: /aiformula_sensing/gyro_odometry_publisher/odom
    avoidance_flag_topic: /lane_stop_flag
    # Wait for OA's real False/True message, including after mid-run restarts.
    avoidance_initially_idle: false
    input_point_a_topic: /original_processed_point_a
    input_point_b_topic: /original_processed_point_b
    input_point_c_topic: /original_processed_point_c
    output_point_a_topic: /processed_point_a
    output_point_b_topic: /processed_point_b
    output_point_c_topic: /processed_point_c
    branch_active_topic: /map_assist/branch_active
    reset_topic: /map_assist/reset
    status_topic: /map_assist/status
    reference_path_topic: /map_assist/path

    # Empty automatically uses the official OSM installed with this package.
    topomap_path: ""
    # Empty selects the supplied map's first closed outer way; start/direction are inferred.
    route_node_ids: ""

    angle_tolerance_deg: 15.0
    progress_tolerance_m: 1.0
    persistence_frames: 5
    max_correction_deg: 8.0
    max_step_deg: 2.0
    enable_correction: true

    sample_spacing_m: 0.2
    smooth_window_m: 1.0
    max_detour_gap_m: 2.0
    max_closure_gap_m: 4.0
    min_lap_distance_m: 40.0
    lap_closure_radius_m: 2.5
    lap_closure_heading_deg: 25.0
    match_window_m: 3.0
    max_match_distance_m: 2.5
    match_heading_limit_deg: 75.0
    max_odom_speed_mps: 4.0
    max_odom_yaw_rate_radps: 3.0
    max_odom_position_std_m: 1.0
    max_odom_yaw_std_deg: 20.0
    max_odom_gap_sec: 2.0
    max_recorded_samples: 20000

    publish_rate_hz: 20.0
    point_timeout_sec: 0.5
    max_point_skew_sec: 0.15
    odom_timeout_sec: 0.5
    # Latch the real flag; resume only after False and a fresh complete triplet.
    resume_delay_sec: 0.2

    # Traffic operation REQUIRES the LYA cmd_vel output to be remapped to the
    # gate input. Do not run with a second direct cmd_vel publisher.
    enable_traffic_control: true
    traffic_light_topic: /map_assist/traffic_light_input
    traffic_stop_flag_topic: /flag_stop
    # Both red and green require a strict majority of real detector frames.
    traffic_vote_window_sec: 0.5
    traffic_vote_min_samples: 3
    # Without signal IDs, re-arm after this long without a red observation.
    traffic_red_rearm_sec: 2.0
    enable_velocity_gate: true
    input_cmd_vel_topic: /map_assist/controller_cmd_vel
    output_cmd_vel_topic: /aiformula_control/game_pad/cmd_vel
    cmd_vel_timeout_sec: 0.5

    # RMSE is for ordered outer-node to Odom-curve matches, in odom metres.
    # The topo-to-odom transform never rescales the measured driving route.
    alignment_max_rmse_m: 3.2
    alignment_ambiguity_margin_m: 0.3
    # Register ordered topo nodes to the closed Odom curve using chords/angles.
    # node_search is the maximum node-to-curve offset; feature_window sets the robust residual scale.
    fusion_node_search_m: 4.0
    fusion_feature_window_m: 2.0
    fusion_shape_weight: 0.25
    fusion_max_displacement_m: 0.75
    # Diagnostic threshold only; candidate position/score disagreement does not block selection.
    fusion_candidate_tolerance_m: 1.0
    # Directed inner-to-outer edge against official-order Odom tangent.
    branch_angle_min_deg: 80.0
    branch_angle_max_deg: 95.0

    # Preview and execute a curved alternative when the radius nears its limit.
    detour_entry_radius_m: 3.0
    detour_waypoint_radius_m: 0.8
    detour_max_cross_track_m: 2.0
    detour_lookahead_m: 1.5
    detour_point_spacing_m: 0.5
    # Placeholder for simulation; replace with the vehicle's measured limit.
    detour_min_turn_radius_m: 4.0
    # Begin while the selected curve still has this radius margin; metres.
    detour_trigger_margin_m: 0.5
    # Predict this far straight ahead; simulation tuning is required.
    detour_trigger_preview_m: 1.0
    detour_max_trim_m: 12.0
    detour_curve_spacing_m: 0.15
    detour_target_angle_deg: 65.0
    detour_plan_update_distance_m: 1.5
