[build-system]
requires = ["setuptools>=77", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "yolop-a3-runtime"
version = "0.2.0"
description = "Single-backbone lane segmentation and object detection"
requires-python = ">=3.10,<3.14"
license = "MIT AND BSD-3-Clause"
license-files = ["LICENSE", "THIRD_PARTY_NOTICES.md"]
dependencies = ["numpy>=2.0", "opencv-python>=4.10", "torch==2.11.0", "torchvision==0.26.0"]

[project.optional-dependencies]
test = ["pytest>=8"]

[tool.setuptools.packages.find]
include = ["yolop_a3_runtime*"]
